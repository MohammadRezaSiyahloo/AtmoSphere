{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% block title %}AtmoSphere{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'weather/index.css' %}">
    <link rel="icon" type="image/png" href="{% static 'weather/images/icons/weather.png' %}" />
</head>
<body>
    <div id="bodyBg"></div>
    <div id="bodyBgWeather"></div>
    <div id="bodyBgOverlay"></div>
    <nav class="navbar">
        <span class="nav-brand">
            <a href="{% url 'index' %}">AtmoSphere</a>
        </span>
        <span class="nav-links">
            <button id="unitToggle" class="unit-toggle-btn">°C</button>
            <a href="/?refresh=all" class="refresh-btn" title="Refresh all cities" onclick="this.classList.add('spinning')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
                Refresh All
            </a>
            {% if user.is_authenticated %}
                <span class="nav-user">{{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" style="display:inline; margin:0;">{% csrf_token %}<button type="submit" class="nav-logout-btn">Logout</button></form>
            {% else %}
                <a href="{% url 'login' %}" class="nav-link-btn">Login</a>
                <a href="{% url 'register' %}" class="nav-link-btn nav-link-primary">Register</a>
            {% endif %}
        </span>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
